<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the Cool biotech company</title>
<meta name="description" content="Pakistan’s first GenZ biotech company and research group.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&family=Sen&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #e67cd8;
    --pink-line: #efdced;
    --green-glow: rgba(190, 226, 190, .5);
    --bar: 87px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #fff;
    color: #000;
    font-family: "Sen", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }

  /* ---------- Desktop ---------- */
  .desktop { position: fixed; inset: 0 0 var(--bar) 0; }
  .desktop::after {            /* soft green fade above the taskbar */
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 110px;
    background: linear-gradient(to top, #e5f0e3, rgba(255, 255, 255, 0));
    pointer-events: none;
  }

  /* ---------- Icons ---------- */
  .icons { position: absolute; left: 65px; top: 70px; display: flex; gap: 28px; align-items: flex-start; z-index: 1; }
  .icon {
    width: 122px; padding: 10px 8px 8px;
    background: transparent; border: 1px solid transparent; border-radius: 4px;
    font: inherit; font-size: 22px; line-height: 1.55; color: #000;
    cursor: pointer; text-align: center;
  }
  .icon svg { display: block; width: 82px; height: 96px; margin: 0 auto 8px; }
  .icon .label { display: block; width: 100px; margin: 0 auto; }
  .icon:hover { background: rgba(125, 175, 230, .12); }
  .icon[aria-expanded="true"] { background: rgba(125, 175, 230, .22); border-color: rgba(100, 150, 210, .45); }
  .icon:focus-visible, .close:focus-visible, .orb:focus-visible { outline: 3px solid #7a3fe0; outline-offset: 2px; }

  /* ---------- Logo ---------- */
  .logo {
    position: absolute; right: 8vw; top: 54%; transform: translateY(-50%);
    margin: 0; padding: .5em .6em; z-index: 1; isolation: isolate;
    font-family: "Poppins", "Arial Black", "Helvetica Neue", Arial, sans-serif;
    font-weight: 800; font-size: clamp(34px, 4.2vw, 58px);
    line-height: .98; letter-spacing: -.045em; text-align: center; color: #000;
  }
  .logo span { display: block; }
  .logo span:nth-child(1) { transform: rotate(-5deg); }
  .logo span:nth-child(2) { transform: rotate(-3deg); }
  .logo span:nth-child(3) { transform: rotate(-6deg); }
  .logo::before {              /* pink glow */
    content: ""; position: absolute; inset: -12% -16%; z-index: -1; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(232, 92, 212, .9) 0%, rgba(232, 100, 214, .5) 50%, rgba(232, 110, 220, 0) 100%);
  }
  .logo::after {               /* faint starburst rays */
    content: ""; position: absolute; inset: -28% -22%; z-index: -1;
    background: repeating-conic-gradient(from 8deg, rgba(233, 110, 216, .7) 0 1.6deg, transparent 1.6deg 30deg);
    -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 30%, transparent 100%);
  }

  /* ---------- Window ---------- */
  .window {
    position: absolute; left: 45px; top: 54px;
    width: 806px; height: min(570px, calc(100dvh - var(--bar) - 78px));
    display: flex; flex-direction: column; z-index: 5;
    background: #fffcfe; border: 7px solid var(--pink); border-top: 0;
    box-shadow: 0 0 70px 26px var(--green-glow);
  }
  .window.pop, .side.pop { animation: pop .16s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  .titlebar { height: 82px; flex: none; display: flex; align-items: center; background: var(--pink); margin: 0 -7px; padding-left: 20px; }
  .close {
    background: none; border: 0; color: #fff; font: inherit; font-size: 26px; line-height: 1;
    padding: 10px 13px; margin-left: -13px; cursor: pointer; text-shadow: 0 1px 1px rgba(90, 0, 80, .35);
  }
  .close:hover { background: rgba(255, 255, 255, .22); }
  .content { flex: 1; overflow: auto; padding: 100px 52px 32px; }
  .content p { margin: 0; max-width: 400px; font-size: 28px; line-height: 1.46; }

  /* ---------- Taskbar ---------- */
  .taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar); z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 63px 0 50px; background: var(--pink); border-top: 6px solid var(--pink-line);
    color: #fff; font-size: 22px; text-shadow: 0 1px 1px rgba(90, 0, 80, .3);
  }
  .orb {
    width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; flex: none; cursor: pointer;
    background:
      radial-gradient(circle at 32% 28%, #e8d3ff 0, rgba(232, 211, 255, 0) 30%),
      radial-gradient(circle at 72% 78%, #3a1a98, rgba(58, 26, 152, 0) 60%),
      conic-gradient(from 200deg, #8a4ff0, #b684f8, #6a35d6, #9a62f2, #8a4ff0);
    box-shadow: inset 0 0 8px rgba(30, 0, 80, .5), 0 0 0 1px rgba(255, 255, 255, .25);
  }

  /* ---------- Side panel (opens from the orb) ---------- */
  .side {
    position: absolute; left: 0; bottom: 0; width: 176px; height: 330px; z-index: 6;
    display: flex; flex-direction: column; transform-origin: bottom left;
    background: linear-gradient(to bottom, #f0bfea 0%, #f0bfea 70%, #d2b1cc 100%);
  }
  .side .close { align-self: flex-end; margin: 6px 0 0; padding: 4px 10px; font-size: 20px; color: #000; text-shadow: none; }
  .side .close:hover { background: rgba(255, 255, 255, .45); }
  .side p { margin: 0; padding: 46px 36px 0; text-align: center; font-size: 24px; line-height: 1.45; }

  /* ---------- Small screens ---------- */
  @media (max-width: 820px) {
    .icons { left: 14px; top: 26px; gap: 6px; }
    .icon { width: 100px; font-size: 17px; }
    .icon svg { width: 64px; height: 76px; }
    .icon .label { width: 84px; }
    .logo { right: 50%; top: 66%; transform: translate(50%, -50%); }
    .window { left: 12px; top: 12px; width: calc(100vw - 24px); height: min(520px, calc(100dvh - var(--bar) - 36px)); }
    .titlebar { height: 56px; }
    .content { padding: 40px 28px 24px; }
    .content p { font-size: 22px; }
    .taskbar { padding: 0 18px; font-size: 15px; }
    .orb { width: 40px; height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) { .window.pop, .side.pop { animation: none; } }
</style>
</head>
<body>

<main class="desktop">

  <nav class="icons" aria-label="Desktop">

    <button class="icon" data-open="projects" aria-controls="window" aria-expanded="false">
      <svg viewBox="0 0 80 100" aria-hidden="true">
        <defs>
          <linearGradient id="fBack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9d4f5"/><stop offset="1" stop-color="#4a8fd0"/></linearGradient>
          <linearGradient id="fFront" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c3e1fb"/><stop offset=".55" stop-color="#7db6e8"/><stop offset="1" stop-color="#4f93d2"/></linearGradient>
          <linearGradient id="fPaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe6ee"/></linearGradient>
        </defs>
        <path d="M6 10Q6 6 10 6H38L44 12H62Q66 12 66 16V90Q66 94 62 94H10Q6 94 6 90Z" fill="url(#fBack)"/>
        <path d="M22 12H50L64 26V86H22Z" fill="url(#fPaper)" stroke="#b9c7d6" stroke-width="1"/>
        <path d="M50 12V26H64Z" fill="#cfd9e5"/>
        <path d="M30 40H56M30 50H56M30 60H50" stroke="#c4cfdb" stroke-width="2" stroke-linecap="round"/>
        <path d="M6 30Q6 26 10 26H40Q68 28 76 42V92Q76 96 72 96H10Q6 96 6 92Z" fill="url(#fFront)" opacity=".88"/>
        <path d="M10 28H40Q66 30 74 43" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>
      </svg>
      <span class="label">Project files</span>
    </button>

    <button class="icon" data-open="about" aria-controls="window" aria-expanded="false">
      <svg viewBox="0 0 80 96" aria-hidden="true">
        <defs>
          <radialGradient id="iBall" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#8dbfeb"/><stop offset=".55" stop-color="#2a6cb0"/><stop offset="1" stop-color="#0c3a70"/></radialGradient>
          <linearGradient id="iShine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        </defs>
        <circle cx="40" cy="44" r="38" fill="url(#iBall)" stroke="#0b3566" stroke-width="2"/>
        <ellipse cx="40" cy="25" rx="28" ry="15" fill="url(#iShine)"/>
        <text x="40" y="64" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#f4f4f4" stroke="#1d4f86" stroke-width="1">i</text>
      </svg>
      <span class="label">About us</span>
    </button>

    <button class="icon" data-open="contact" aria-controls="window" aria-expanded="false">
      <svg viewBox="0 0 82 96" aria-hidden="true">
        <defs>
          <linearGradient id="pBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5db0f0"/><stop offset="1" stop-color="#1b66b5"/></linearGradient>
          <radialGradient id="pHead" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8fcbff"/><stop offset="1" stop-color="#2273c4"/></radialGradient>
        </defs>
        <g fill="url(#pBody)" stroke="#16558f" stroke-width="1">
          <path d="M2 74Q2 48 17 46Q32 48 32 74Z"/>
          <path d="M50 74Q50 48 65 46Q80 48 80 74Z"/>
        </g>
        <g fill="url(#pHead)" stroke="#16558f" stroke-width="1">
          <circle cx="17" cy="35" r="9"/><circle cx="65" cy="35" r="9"/>
        </g>
        <path d="M23 86Q23 52 41 50Q59 52 59 86Z" fill="url(#pBody)" stroke="#16558f" stroke-width="1"/>
        <circle cx="41" cy="36" r="11" fill="url(#pHead)" stroke="#16558f" stroke-width="1"/>
      </svg>
      <span class="label">connect with us</span>
    </button>

  </nav>

  <h1 class="logo"><span>the Cool</span><span>biotech</span><span>company</span></h1>

  <!-- One window, three panels. Edit the text inside each <p> to change what shows. -->
  <section class="window" id="window" role="dialog" aria-label="" hidden>
    <header class="titlebar">
      <button class="close" type="button" aria-label="Close window">x</button>
    </header>
    <div class="content">
      <p data-panel="projects" hidden>Project 1<br>project 2<br>project 3<br>project 4<br>projects are soon to come</p>
      <p data-panel="about" hidden>we are pakistan’s first GenZ biotech company/ research group!!!!!!!!!!!</p>
      <p data-panel="contact" hidden>contact information is yet to come.</p>
    </div>
  </section>

  <aside class="side" id="side" aria-label="Coming soon" hidden>
    <button class="close" type="button" aria-label="Close panel">X</button>
    <p>Coming soon</p>
  </aside>

</main>

<footer class="taskbar">
  <button class="orb" type="button" aria-label="Open menu" aria-controls="side" aria-expanded="false"></button>
  <div>Today’s date : <span id="date">28 oct 2026</span></div>
</footer>

<script>
(() => {
  const win = document.getElementById('window');
  const closeBtn = win.querySelector('.close');
  const panels = win.querySelectorAll('[data-panel]');
  const icons = document.querySelectorAll('.icon');
  let lastIcon = null;

  function openWindow(name, trigger) {
    panels.forEach(p => { p.hidden = p.dataset.panel !== name; });
    icons.forEach(i => i.setAttribute('aria-expanded', String(i === trigger)));
    win.setAttribute('aria-label', trigger.querySelector('.label').textContent);
    win.hidden = false;
    win.classList.remove('pop'); void win.offsetWidth; win.classList.add('pop');
    lastIcon = trigger;
    closeBtn.focus();
  }

  function closeWindow() {
    win.hidden = true;
    icons.forEach(i => i.setAttribute('aria-expanded', 'false'));
    if (lastIcon) lastIcon.focus();
  }

  icons.forEach(i => i.addEventListener('click', () => openWindow(i.dataset.open, i)));
  closeBtn.addEventListener('click', closeWindow);
  const side = document.getElementById('side');
  const orb = document.querySelector('.orb');
  const sideClose = side.querySelector('.close');

  function toggleSide(show) {
    side.hidden = !show;
    orb.setAttribute('aria-expanded', String(show));
    if (show) {
      side.classList.remove('pop'); void side.offsetWidth; side.classList.add('pop');
      sideClose.focus();
    } else {
      orb.focus();
    }
  }
  orb.addEventListener('click', () => toggleSide(side.hidden));
  sideClose.addEventListener('click', () => toggleSide(false));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!side.hidden) toggleSide(false);
    else if (!win.hidden) closeWindow();
  });

  // Taskbar date, e.g. "28 oct 2026". To lock it to a fixed date, delete this block.
  const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const now = new Date();
  document.getElementById('date').textContent = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
})();
</script>
</body>
</html>
